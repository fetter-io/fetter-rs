name: CI

on:
  pull_request_target:
    branches:
      - default
  push:
    branches:
      - default
  release:
    types: published

jobs:
  #-----------------------------------------------------------------------------
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] #, windows-latest]
        rust: ["1.81.0", stable]
        python: ["3.9", "3.13"]

    name: Build & Test / ${{ matrix.os }} / Rust ${{ matrix.rust }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Git commit info
        run: git log -n 1

      - uses: actions/setup-python@master
        with:
          python-version: ${{ matrix.python }}

      - name: Install Rust
        run: rustup install --no-self-update ${{ matrix.rust }} && rustup default ${{ matrix.rust }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  #-----------------------------------------------------------------------------
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup install --no-self-update stable && rustup default stable

      - name: Check formatting
        run: |
          rustup component add rustfmt
          cargo fmt -- --check

      - name: Lint with Clippy
        run: |
          rustup component add clippy
          cargo clippy -- -D warnings

