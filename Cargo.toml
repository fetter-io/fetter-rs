[package]
name = "fetter"
version = "5.2.2"

edition = "2021"
rust-version = "1.89"
# MSRV-aware dependency resolution: prefer versions whose rust-version is at most ours
resolver = "3"
authors = ["Christopher Ariza"]
repository = "https://github.com/fetter-io/fetter-rs"
license = "GPL-3.0-or-later"
readme = "README.md"
# the working spec and articles are for the repository, not the published crate
exclude = ["SPEC.md", "doc/"]

description = "Comprehensive open-source supply-chain visibility, providing system-wide package discovery, validation, vulnerability scanning, and allow-listing for Python, npm, Cargo, Go, Ruby, PHP, Swift, pre-commit hooks, GitHub Actions, VS Code extensions, and Chromium and Firefox browser extensions."
keywords = ["sbom", "vulnerability", "allow-listing", "cybersecurity", "osv"]

categories = [
    "filesystem",
    "command-line-utilities",
]

[dependencies]
rayon = "1.10"
pest = "2.3"
pest_derive = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5.17", features = ["derive"] }
ureq = "3.0.11"
crossterm = "0.29.0"
tempfile = "3.11.0"
toml = "1.1.3"
sha2 = "0.11.0"
serde-saphyr = "2.1.1"
semver = "1.0.28"
nodejs-semver = "7.0.0"
cvss = "2.1.1"

[profile.release]
debug = false
